services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logstream-backend
    env_file:
      - .env
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: logstream-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped